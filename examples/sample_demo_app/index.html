<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoTest Sample Demo App — Task Tracker</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
        padding: 2rem;
      }
      .card {
        max-width: 640px;
        margin: 0 auto;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 1.5rem;
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }
      label {
        display: block;
        margin-top: 0.75rem;
        font-size: 0.9rem;
        color: #cbd5e1;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.25rem;
        padding: 0.55rem 0.7rem;
        border-radius: 6px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #f8fafc;
      }
      button {
        margin-top: 1rem;
        padding: 0.55rem 1rem;
        border-radius: 6px;
        border: none;
        background: #3b82f6;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary {
        background: #475569;
      }
      .hidden {
        display: none;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .row input {
        flex: 1;
      }
      ul {
        list-style: none;
        padding: 0;
        margin-top: 1rem;
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 0.75rem;
        margin-bottom: 0.5rem;
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 6px;
      }
      li.done span {
        text-decoration: line-through;
        color: #94a3b8;
      }
      .status {
        margin-top: 0.75rem;
        color: #38bdf8;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>AutoTest Sample Task Tracker</h1>

      <section id="login-view" aria-label="Sign In">
        <p>Sign in with any username to try recording authentication (password is redacted).</p>
        <form id="login-form">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            data-testid="username-input"
            type="text"
            placeholder="demo@example.com"
            required
          />

          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            data-testid="password-input"
            type="password"
            placeholder="Enter password"
            required
          />

          <button type="submit" data-testid="login-submit">Sign In</button>
        </form>
      </section>

      <section id="tasks-view" class="hidden" aria-label="Tasks">
        <div class="row" style="justify-content: space-between">
          <p id="welcome-banner" data-testid="welcome-banner"></p>
          <button type="button" class="secondary" data-testid="logout-btn" id="logout-btn">
            Sign Out
          </button>
        </div>

        <form id="add-task-form" class="row">
          <input
            id="new-task"
            name="new_task"
            data-testid="new-task-input"
            type="text"
            placeholder="Add a new task..."
            aria-label="New task"
          />
          <button type="submit" data-testid="add-task-btn">Add Task</button>
        </form>

        <input
          id="filter-tasks"
          name="filter"
          data-testid="filter-input"
          type="text"
          placeholder="Filter tasks..."
          aria-label="Filter tasks"
          style="margin-top: 0.75rem"
        />

        <ul id="task-list" data-testid="task-list"></ul>
        <p id="status-msg" class="status" data-testid="status-msg"></p>
      </section>
    </main>

    <script>
      const loginView = document.getElementById("login-view");
      const tasksView = document.getElementById("tasks-view");
      const welcomeBanner = document.getElementById("welcome-banner");
      const taskList = document.getElementById("task-list");
      const statusMsg = document.getElementById("status-msg");
      const filterInput = document.getElementById("filter-tasks");

      let tasks = [
        { id: 1, title: "Record user workflow", done: false },
        { id: 2, title: "Review generated Pytest suite", done: false },
      ];

      function renderTasks() {
        const query = filterInput.value.trim().toLowerCase();
        taskList.innerHTML = "";
        const visible = tasks.filter((t) => t.title.toLowerCase().includes(query));
        for (const task of visible) {
          const li = document.createElement("li");
          if (task.done) li.classList.add("done");

          const label = document.createElement("label");
          label.style.marginTop = "0";
          label.style.display = "flex";
          label.style.alignItems = "center";
          label.style.gap = "0.5rem";

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.done;
          checkbox.setAttribute("aria-label", `Complete ${task.title}`);
          checkbox.addEventListener("change", () => {
            task.done = checkbox.checked;
            statusMsg.textContent = task.done
              ? `Completed: ${task.title}`
              : `Reopened: ${task.title}`;
            renderTasks();
          });

          const span = document.createElement("span");
          span.textContent = task.title;

          label.appendChild(checkbox);
          label.appendChild(span);
          li.appendChild(label);
          taskList.appendChild(li);
        }
      }

      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const user = document.getElementById("username").value.trim();
        if (!user) return;
        welcomeBanner.textContent = `Signed in as ${user}`;
        loginView.classList.add("hidden");
        tasksView.classList.remove("hidden");
        statusMsg.textContent = "Welcome back!";
        renderTasks();
      });

      document.getElementById("add-task-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("new-task");
        const title = input.value.trim();
        if (!title) return;
        tasks.push({ id: Date.now(), title, done: false });
        input.value = "";
        statusMsg.textContent = `Added task: ${title}`;
        renderTasks();
      });

      filterInput.addEventListener("input", renderTasks);

      document.getElementById("logout-btn").addEventListener("click", () => {
        tasksView.classList.add("hidden");
        loginView.classList.remove("hidden");
        document.getElementById("password").value = "";
      });
    </script>
  </body>
</html>
