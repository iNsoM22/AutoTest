[project]
name = "autotest"
version = "0.1.0"
description = "Cross-platform desktop E2E test recorder and generator producing Python + Playwright + Pytest suites."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "platformdirs>=4.3.6",
    "playwright>=1.50.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyside6>=6.8.0",
    "pytest>=8.3.0",
    "pytest-playwright>=0.7.0",
]

[project.scripts]
autotest = "src.app:main"

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = [
    "N802", # Qt overrides use camelCase method names (e.g., closeEvent)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --basetemp=.pytest_cache/tmp"
markers = [
    "ui: tests requiring Qt / PySide6 GUI components",
    "browser: tests launching Playwright Chromium",
]

[tool.mypy]
python_version = "3.12"
packages = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
